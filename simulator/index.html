<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eagle Jungle Simulator</title>
<meta name="description" content="Physics-based 3D simulation of a perching 'Eagle' drone locating an isolated person in Taiwan mountain jungle with no GPS, cell or comms. Code Metal hackathon, Team 32.">
<style>/* base reset */:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sofia+Sans+Semi+Condensed:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: full-bleed 3D jungle under glass instrument panels — settings left, Eagle cam + sensors right, mission dock bottom.
   Phones: the 3D view on top, panels as tabs below. One deliberate dark look (night ops), colours from MIL-STD-2525 affiliations + thermal amber. */
:root{
  color-scheme: dark;
  --bg:#08110f;
  --panel:rgba(9,19,17,.82);
  --panel-2:rgba(20,36,33,.9);
  --line:rgba(150,196,184,.17);
  --line-2:rgba(150,196,184,.32);
  --fg:#e2ebe6;
  --muted:#93a9a1;
  --dim:#64796f;
  --accent:#ffb347;      /* thermal amber */
  --accent-ink:#1b1206;
  --friend:#80e0ff;      /* MIL-STD-2525 friendly */
  --hostile:#ff8080;     /* hostile */
  --unknown:#ffff80;     /* unknown */
  --neutral:#aaffaa;     /* neutral */
  --ok:#6fe3a5; --warn:#ffd166; --bad:#ff7b7b;
  --font-display:"Sofia Sans Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--font-display);overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--friend);outline-offset:2px}
#stage{position:fixed;inset:0;background:#050a09}
#gl{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-9999px,0);padding:1px 7px;border-radius:4px;background:rgba(5,11,10,.74);border:1px solid currentColor;font:600 10.5px/1.45 var(--font-data);letter-spacing:.05em;white-space:nowrap;color:var(--friend)}
.lbl.hostile{color:var(--hostile)}.lbl.unknown{color:var(--unknown)}.lbl.neutral{color:var(--neutral)}.lbl.lkl{color:var(--accent)}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:currentColor;opacity:.7}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:600 13px var(--font-data);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15);box-shadow:0 12px 32px rgba(0,0,0,.38)}
#top{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));height:50px;display:flex;align-items:center;gap:14px;padding:6px 12px 6px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#viewbar{top:calc(72px + env(safe-area-inset-top,0px));left:calc(max(16px,env(safe-area-inset-left,0px)) + 304px);display:flex;align-items:center;gap:8px;padding:5px;border-radius:10px}
.mark{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--accent) 0 22%,transparent 23%),conic-gradient(from 200deg,var(--friend),transparent 35%,var(--friend) 70%,transparent);box-shadow:0 0 0 1px var(--line-2) inset;flex:none}
h1{margin:0;font:800 16px/1.1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
#envline{margin:1px 0 0;font:500 11.5px/1.3 var(--font-data);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.find{margin-left:auto;display:flex;align-items:center;gap:8px;font:600 12px var(--font-data);letter-spacing:.04em;min-width:0;flex:none;max-width:62%}
.find .by{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;font:600 10.5px/1.5 var(--font-data);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}.chip.friend{color:var(--friend)}.chip.unknown{color:var(--unknown)}.chip.dim{color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;padding:4px 9px;font:600 11.5px/1.3 var(--font-display);letter-spacing:.03em;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--friend);color:#06222b}
.seg button:hover:not(.on){color:var(--fg);background:rgba(128,224,255,.08)}
#hidePanels{background:transparent;border:1px solid var(--line-2);border-radius:8px;padding:4px 10px;color:var(--muted);font-weight:600;font-size:12px}
#hidePanels:hover{color:var(--fg)}
#left{top:calc(72px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:292px;overflow:auto;padding:12px 12px 16px}
#right{top:calc(72px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:344px;overflow:auto;padding:12px}
#bottom{left:calc(max(16px,env(safe-area-inset-left,0px)) + 304px);right:calc(max(16px,env(safe-area-inset-right,0px)) + 356px);bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
body.nopanels #left,body.nopanels #right,body.nopanels #bottom{display:none}
body.nopanels #viewbar{left:max(16px,env(safe-area-inset-left,0px))}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}
h2{margin:0;font:700 12px/1.2 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tagm{font:600 9.5px var(--font-data);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(255,179,71,.45);border-radius:4px;padding:0 5px}
.hint{font-size:11px;color:var(--dim)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.presets button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:left;font-weight:700;font-size:12.5px;line-height:1.2;color:var(--fg)}
.presets button small{display:block;font:500 10.5px var(--font-data);color:var(--muted);margin-top:2px}
.presets button.on{border-color:var(--friend);box-shadow:0 0 0 1px var(--friend) inset}
.grp{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.grp h3{margin:0 0 8px;font:700 11px var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ctl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 8px;margin:0 0 9px}
.ctl label{font-size:12.5px;color:var(--fg)}
.ctl output{font:500 11.5px var(--font-data);color:var(--accent);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);height:18px;margin:0}
.ctl .seg,.ctl select{grid-column:1/-1}
.ctl select{width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;font-size:12.5px}
.ctl.tog{grid-template-columns:1fr auto}
.switch{appearance:none;-webkit-appearance:none;width:34px;height:19px;border-radius:999px;background:#2a3b37;border:1px solid var(--line-2);position:relative;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch:checked{background:var(--friend)}
.switch:checked::after{transform:translateX(15px);background:#06222b}
.ovl{display:flex;flex-wrap:wrap;gap:6px}
.ovl label{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.ovl input{accent-color:var(--friend);margin:0}
.camwrap{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line-2);background:#000;aspect-ratio:4/3;max-width:100%}
#pip{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:grab}
.camstrip{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:6px;padding:3px 7px;background:rgba(0,0,0,.62);font:500 10.5px var(--font-data);color:#e8e8e0;letter-spacing:.03em;white-space:nowrap;overflow:hidden}
.camnote{font:500 11px/1.45 var(--font-data);color:var(--muted);margin:6px 0 2px}
.camnote b{color:var(--fg);font-weight:600}
section+section{margin-top:14px}
.card{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:7px;background:rgba(255,255,255,.015)}
.card .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .name{font-weight:700;font-size:13px;letter-spacing:.02em}
.card .big{font:600 15px var(--font-data);color:var(--fg);font-variant-numeric:tabular-nums;margin-top:3px}
.card .big small{font:500 11px var(--font-data);color:var(--muted)}
.card .sub{font:500 11px/1.45 var(--font-data);color:var(--muted);margin-top:3px}
.card .note{font-size:11.5px;line-height:1.35;color:var(--dim);margin-top:4px}
.card.det{border-color:rgba(111,227,165,.38)}
.fixcard{border-color:rgba(128,224,255,.35)}
#life{list-style:none;margin:0;padding:0;display:grid;gap:5px}
#life li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:8px}
#life li.off{opacity:.45}
#life .sym{width:12px;height:12px;border:2px solid currentColor;border-radius:2px}
#life .sym.unknown{border-radius:50%}#life .sym.animal{transform:rotate(45deg);border-radius:1px}
#life .ev{font:500 10.5px var(--font-data);color:var(--muted)}
.mhead{display:flex;align-items:center;gap:10px;min-width:0}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:7px 14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;flex:none}
.primary:disabled{opacity:.6;cursor:default}
#steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px;min-width:0;flex:1}
#steps li{flex:none;border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:11px;color:var(--muted);white-space:nowrap;line-height:1.25}
#steps li span{display:block;font:500 10px var(--font-data);color:var(--dim)}
#steps li.on{border-color:var(--accent);color:var(--fg);background:rgba(255,179,71,.1)}
#steps li.done{color:var(--fg)}
#steps li.hold{border-color:var(--bad);color:var(--bad)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 196px;gap:10px;min-height:0;flex:1}
.log{min-width:0;height:214px;overflow:auto;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:500 10.8px/1.5 var(--font-data);color:#cfe0d9}
.log .l{white-space:pre-wrap;word-break:break-word}
.log .k{color:var(--friend)}.log .w{color:var(--warn)}.log .b{color:var(--bad)}.log .d{color:var(--dim)}
.mapwrap{display:flex;flex-direction:column;gap:4px}
.mapcap{font:500 10px var(--font-data);color:var(--dim);letter-spacing:.03em}
#map{width:196px;height:196px;border-radius:8px;border:1px solid var(--line-2);background:#0d1513}
#tabs{display:none}
@media (max-width:1240px){#left{width:262px}#right{width:316px}#bottom{left:calc(max(16px,env(safe-area-inset-left,0px)) + 274px);right:calc(max(16px,env(safe-area-inset-right,0px)) + 328px)}#viewbar{left:calc(max(16px,env(safe-area-inset-left,0px)) + 274px)}.mrow{grid-template-columns:minmax(0,1fr) 176px}#map{width:176px;height:176px}}
@media (max-width:1099px){
  body{overflow:auto}
  #stage{position:relative;height:58vh;min-height:320px}
  #top{position:absolute;border-radius:10px;height:auto;flex-wrap:wrap;gap:6px 10px}
  #viewbar{position:absolute;top:calc(max(58vh,320px) - 48px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));justify-content:center}
  #viewbar .seg button{padding:5px 8px}
  #hidePanels{display:none}
  .find{margin-left:0;max-width:100%;flex-wrap:wrap}
  .panel:not(#top){position:static;width:auto;margin:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--panel-2)}
  #tabs{display:flex;gap:6px;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-bottom:8px}
  #tabs button{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;font-weight:700;font-size:12.5px;color:var(--muted)}
  #tabs button.on{color:#06222b;background:var(--friend);border-color:var(--friend)}
  [data-tabpanel]:not(.show){display:none!important}
  #left,#right{max-height:none;overflow:visible}
  #bottom{margin-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .mrow{grid-template-columns:1fr;}
  .log{height:180px}
  #map{width:100%;height:auto;aspect-ratio:1/1;max-width:420px}
  .mhead{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<div id="stage">
  <canvas id="gl" aria-label="3D view of the jungle scenario"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="loading">Growing the jungle…</div>
</div>

<header id="top" class="panel">
  <div class="brand"><span class="mark" aria-hidden="true"></span><div style="min-width:0"><h1>Eagle · Jungle find</h1><p id="envline">Central Mountain Range, Taiwan</p></div></div>
  <div class="find" id="findPill"></div>
</header>
<div id="viewbar" class="panel">
  <div class="seg viewbtns" role="group" aria-label="Camera">
    <button data-cam="orbit" class="on">Orbit</button><button data-cam="eagle">Eagle eye</button><button data-cam="operator">Operator's view</button><button data-cam="top">Top-down</button>
  </div>
  <button id="hidePanels" title="Hide panels (H)">Hide panels</button>
</div>

<nav id="tabs" aria-label="Panels">
  <button data-tab="right" class="on">Eagle cam</button><button data-tab="bottom">Mission</button><button data-tab="left">Settings</button>
</nav>

<aside id="left" class="panel" data-tabpanel aria-label="Settings">
  <div class="phead"><h2>Scenario</h2><span class="hint">each change re-runs the model</span></div>
  <div id="presets" class="presets"></div>
  <div id="controls"></div>
  <div class="grp"><h3>Display</h3>
    <div class="ctl"><label>Quality</label><output id="qOut">auto</output><div class="seg" id="quality"><button data-q="auto" class="on">Auto</button><button data-q="low">Low</button><button data-q="med">Med</button><button data-q="high">High</button></div></div>
    <div class="ovl" id="overlays">
      <label><input type="checkbox" id="ov-snd" checked> Sound ring</label>
      <label><input type="checkbox" id="ov-th" checked> Thermal ring</label>
      <label><input type="checkbox" id="ov-fr" checked> Camera cone</label>
      <label><input type="checkbox" id="ov-lbl" checked> Labels</label>
    </div>
  </div>
</aside>

<aside id="right" class="panel show" data-tabpanel aria-label="Eagle cam and sensors">
  <section>
    <div class="phead"><h2>Eagle cam</h2><div class="seg" id="pipMode"><button data-pip="thermal" class="on">Thermal</button><button data-pip="visible">Visible</button><button data-pip="id">ID pass</button></div></div>
    <div class="camwrap"><canvas id="pip" width="640" height="480" aria-label="View from the Eagle's camera"></canvas><div class="camstrip" id="camstrip"></div></div>
    <div class="camnote" id="camnote"></div>
  </section>
  <section id="navigation-demo" aria-label="GPS-denied navigation demonstration"></section>
  <section><div class="phead"><h2>Sensors</h2><span class="tagm">model</span></div><div id="cards"></div></section>
  <section><div class="phead"><h2>Life list</h2><span class="hint">what Eagle reports</span></div><ul id="life"></ul></section>
</aside>

<section id="bottom" class="panel" data-tabpanel aria-label="Mission">
  <div class="mhead"><button id="run" class="primary">Run mission</button><ol id="steps"></ol></div>
  <div class="mrow">
    <div class="log" id="log" role="log" aria-live="polite"></div>
    <div class="mapwrap"><canvas id="map" width="392" height="392" aria-label="ATAK-style map of reported tracks"></canvas><div class="mapcap">ATAK view · reported tracks · local grid m</div></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>

<script id="eagle-model">
/* EagleModel: physics for the Eagle Jungle Simulator (downed operator, Taiwan mountain jungle).
 * Pure functions, no DOM. Browser: window.EagleModel. Node: module.exports.
 * Every constant lives in PARAMS with its basis. "model" numbers are estimates from these
 * equations, not measurements.
 */
(function (root) {
  'use strict';
  var log10 = Math.log10, exp = Math.exp, sqrt = Math.sqrt, atan = Math.atan, cos = Math.cos, PI = Math.PI;
  var D2R = PI / 180;

  var PARAMS = {
    climate: {   // July mean daily max/min and mean RH, CWA normals 1991-2020
      300:  { tMax: 33.3, tMin: 25.5, rh: 75 },     // Taichung (lowland)
      1000: { tMax: 28.3, tMin: 20.1, rh: 84.5 },   // Sun Moon Lake station, 1,015 m
      1500: { tMax: 25.3, tMin: 17.1, rh: 88 }      // estimate: Sun Moon Lake minus 6 C/km lapse
    },
    weatherTempOffset: { clear: 0, mist: -1.5, rain: -3.0, typhoon: -4.0 },
    noise: {     // ambient, dBA (biophony by hour + rain, combined by power sum)
      day: 62,       // 07-17 h: summer cicada chorus (estimate; one cicada is ~73 dB LAeq at 1 m, sings at 4.7-10 kHz)
      dusk: 56,      // 17-20 h: cicadas fading, frogs/insects starting (estimate)
      night: 48,     // 20-03 h: insects and frogs (estimate)
      predawn: 42,   // 03-06 h: lull before the dawn chorus (estimate)
      dawn: 52,      // 06-07 h: dawn chorus (estimate)
      rain: { clear: 0, mist: 0, rain: 54, typhoon: 64 },   // Sato et al. 2021: ~54 dB at ~16 mm/h, 63.9 dB at 160 mm/h; canopy wind not included
      elevation: { 300: 2, 1000: 0, 1500: -3 }
    },
    acoustic: {
      alphaAir: { 1000: 0.005, 2000: 0.009, 3000: 0.014, 4000: 0.020 },   // dB/m (ISO 9613-1 order)
      alphaVeg: { 1000: 0.06, 2000: 0.08, 3000: 0.085, 4000: 0.09 },      // dB/m dense foliage (ISO 9613-2 Table A.1)
      vegFactor: 1.0,     // French Guiana rainforest measured ~0.5x this (Haupert 2023); other tropical sites several x
      detectSNR_dB: 6,
      signals: {          // SL = dB at 1 m (A-weighted for voice); bandGain = in-band noise below the broadband dBA
                          // (insects and cicadas sing mostly above the speech band; whistles share it more)
        none:          { label: 'No signal', SL: null },
        softWhistle:   { label: 'Mouth whistle (no equipment)', SL: 85, f: 2500, bandGainNight: 10, bandGainDay: 10, dur_s: 2.5 },   // assumed level
        voice:         { label: 'Normal voice', SL: 57, f: 1000, bandGainNight: 8, bandGainDay: 8, dur_s: 3.0 },      // Pearsons 1977
        shout:         { label: 'Shout', SL: 85, f: 1000, bandGainNight: 8, bandGainDay: 8, dur_s: 2.0 }              // Pearsons 1977
      }
    },
    thermal: {
      cameras: {
        mlx55:    { label: 'MLX90640 32x24, 55 deg', w: 32, h: 24, hfov: 55, netd: 0.10 },
        hti256:   { label: 'HTI HT-203 class 256x192, 56 deg', w: 256, h: 192, hfov: 56, netd: 0.05 },
        lepton35: { label: 'FLIR Lepton 3.5 160x120, 57 deg', w: 160, h: 120, hfov: 57, netd: 0.05 },

    else if (/look/.test(name)) { pipMode = 'thermal'; $$('#pipMode button').forEach(x => x.classList.toggle('on', x.dataset.pip === 'thermal')); pipDirty = true; logLine('', `${t}LOOK      ${s.note || ''} · ${pipStats.opPx} px in this frame`); camGoal('eagle-wide'); }
    else if (/^fix/.test(name)) { running.showFix = true; updateOverlays(); drawMap(); logLine('', `${t}FIX       ${s.note || ''}`); camGoal('fix'); }
    else if (/relay/.test(name)) { beam.visible = true; setLine(beam, [W.eagle, relay.position.clone(), edge()]); flyDot([W.eagle.clone(), relay.position.clone(), edge()], 1500); take(/^(FIX|LIFE|SBD|COURIER)/).forEach(m => logLine('k', `${t}${msgLine(m)}`)); logLine('d', `${pad}${s.note || ''}`); camGoal('relay'); }
    else if (/marker/.test(name)) { mapPulse = performance.now(); logLine('k', `${t}MARKER    ${s.note || ''} · CE ${num(R.fix.ce_m, 1)} m`); camGoal('fix'); }

  }

  logLine('d', `# done · ${R.timeToMarker_s != null ? 'marker on ATAK ' + tS(R.timeToMarker_s) + ' after the Eagle starts listening' : 'no marker: no sensor fixed him'}`);
  running.on = false; $('#run').disabled = false; $('#run').textContent = 'Run again'; beam.visible = false; downBeam.visible = false; renderSteps(tl.length); drawMap();
}
const flight = { pts: null, t0: 0, dur: 1 };

function setCamMode(m) { camMode = m; $$('.viewbtns button').forEach(b => b.classList.toggle('on', b.dataset.cam === m)); controls.enabled = m === 'orbit' || m === 'top'; updateOverlays(); if (m === 'orbit') { camGoal('orbit'); } if (m === 'top') { const c = W.eagleBase.clone().lerp(W.op, 0.5); flyCam(new THREE.Vector3(c.x, 620, c.z + 1), new THREE.Vector3(c.x, 0, c.z)); } }

  else if (kind === 'op') flyCam(op.clone().add(side.clone().multiplyScalar(9)).add(new THREE.Vector3(0, 6, 0)).add(away.clone().multiplyScalar(6)), op.clone().setY(op.y + 0.5));

}

{ const cv = $('#pip'); let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: pipYaw, pitch: pipPitch }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });

// ---------- animation ----------
let last = performance.now(), time = 0, idleT = 0, pipT = 0;
function animate(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt; wind.uTime.value = time; idleT += dt;

  boar.rotation.y = 0.8 + Math.sin(time * 0.4) * 0.5; muntjacs.forEach((q, i) => { q.rotation.y = -0.6 + i * 1.7 + Math.sin(time * 0.3 + i) * 0.4; }); sambar.rotation.y = 1.9 + Math.sin(time * 0.2) * 0.3;
